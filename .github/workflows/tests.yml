name: PHP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, dom, zip
          coverage: none
      - run: find src bin plugins tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/run.php
      - run: php bin/triage.php tests/fixtures/complete.json > /tmp/estrabao-report.json
      - run: php bin/desk.php tests/fixtures/complete.json > /tmp/estrabao-desk-response.json
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/js/reference-guidance.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/package -v
      - run: python -m unittest discover -s tests/operations -v
